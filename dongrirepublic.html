<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>どんぐりタイピング</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23ffffff' d='M45,10 C42,15 35,12 30,18 C25,24 28,32 22,35 C15,38 10,32 5,42 C12,42 16,46 20,43 C24,40 25,35 30,36 C28,42 22,46 18,52 C24,52 30,48 34,44 C32,50 28,55 24,62 C32,58 38,52 42,46 C40,54 36,62 30,72 C48,74 58,64 62,50 C65,40 60,32 65,24 C70,16 80,20 85,12 C78,16 74,12 70,18 C66,24 68,32 62,35 C58,37 54,32 50,34 C54,28 56,22 54,16 C52,22 48,25 45,10 Z M65,48 C72,52 82,50 90,56 C82,56 76,58 72,62 C78,65 86,68 95,74 C84,72 76,70 70,66 C68,72 64,80 58,88 C62,80 64,74 65,66 C60,64 54,64 48,66 C54,62 60,60 65,48 Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141812;
    --panel:#1c2419;
    --panel-edge: rgba(160,115,70,0.22);
    --gold:#a07346;
    --gold-soft:#d2b48c;
    --paper:#f5eedc;
    --jade:#789c68;
    --vermillion:#c1554b;
    --muted:#727c6b;
    --text:#efe8d8;
    --achievement-gold:#ffd700;
    --achievement-silver:#c0c0c0;
    --achievement-bronze:#cd7f32;
    --phantom:#9b59b6;
    --phantom-glow:#8e44ad;
    --coin-gold:#ffd700;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--ink);
    color:var(--text);
    font-family:'Zen Maru Gothic', sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body.phantom-font {
    font-family: 'M PLUS Rounded 1c', 'Comic Sans MS', cursive, sans-serif;
  }
  body.phantom-font .kana-display,
  body.phantom-font .romaji-display,
  body.phantom-font .title,
  body.phantom-font .tagline,
  body.phantom-font .hanko-score,
  body.phantom-font .score-value,
  body.phantom-font .result-score-num {
    font-family: 'M PLUS Rounded 1c', 'Comic Sans MS', cursive, sans-serif;
    letter-spacing: 0.1em;
  }
  body.phantom-font .kana-display {
    text-shadow: 0 0 20px rgba(155,89,182,0.4);
  }
  #app{ position:relative; width:100%; height:100vh; display:flex; align-items:center; justify-content:center; }
  .screen{ width:100%; max-width:640px; padding:32px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .hidden{ display:none !important; }

  /* ---------- Forest Background Canvas Layer ---------- */
  #forest-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }

  /* ---------- Acorn particles canvas layer ---------- */
  #acorn-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 150;
  }

  /* ---------- Hanko highscore badge ---------- */
  .hanko{
    position:fixed; top:20px; left:20px;
    width:94px; height:94px;
    border-radius:50%;
    border:3px solid var(--gold);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-6deg);
    background:rgba(160,115,70,0.12);
    box-shadow: inset 0 0 0 1px rgba(160,115,70,0.3), 0 4px 12px rgba(0,0,0,0.4);
    z-index: 50;
    transition: opacity 0.3s ease, transform 0.3s ease;
    cursor: pointer;
  }
  .hanko:hover{ transform:rotate(-6deg) scale(1.05); }
  .hanko.hidden-ui{
    opacity: 0; pointer-events: none; transform: scale(0.9) rotate(-6deg);
  }
  .hanko-label{ font-size:12px; font-weight:700; letter-spacing:2px; color:var(--gold-soft); opacity:0.9; }
  .hanko-score{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:24px; font-weight:700; color:var(--gold-soft);
    line-height:1.1;
  }
  .hanko-sub{
    font-size:9px; color:var(--muted); margin-top:2px;
  }

  /* ---------- Top Navigation ---------- */
  .top-nav{
    position:fixed; top:20px; right:20px;
    display:flex; gap:10px; z-index:50;
    align-items:center;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .top-nav.hidden-ui{
    opacity: 0; pointer-events: none; transform: scale(0.9);
  }
  .nav-btn {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--gold-soft);
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .nav-btn:hover {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
  }
  .nav-btn.achievement-btn {
    border-color: var(--achievement-gold);
    color: var(--achievement-gold);
  }
  .nav-btn.achievement-btn:hover {
    background: var(--achievement-gold);
    color: var(--ink);
  }

  /* ---------- Achievement Toast ---------- */
  #achievement-toast {
    position: fixed; top: 80px; right: 20px;
    background: var(--panel);
    border: 2px solid var(--achievement-gold);
    border-radius: 12px;
    padding: 16px 24px;
    z-index: 300;
    transform: translateX(120%);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    max-width: 320px;
    pointer-events: none;
  }
  #achievement-toast.show {
    transform: translateX(0);
  }
  #achievement-toast .toast-title {
    font-size: 14px;
    color: var(--muted);
  }
  #achievement-toast .toast-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--achievement-gold);
  }
  #achievement-toast .toast-desc {
    font-size: 13px;
    color: var(--text);
    opacity: 0.8;
  }

  /* ---------- Achievement Modal ---------- */
  #achievement-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 24, 18, 0.92);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #achievement-overlay.active {
    opacity: 1; pointer-events: auto;
  }
  .achievement-card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 16px;
    padding: 32px 36px;
    display: flex; flex-direction: column;
    width: 100%; max-width: 560px;
    max-height: 80vh;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    transform: translateY(16px);
    transition: transform 0.3s ease;
    z-index: 201;
    overflow-y: auto;
  }
  #achievement-overlay.active .achievement-card {
    transform: translateY(0);
  }
  .achievement-title {
    font-size: 22px; font-weight: 700; color: var(--text);
    margin: 0 0 4px 0; letter-spacing: 0.05em;
  }
  .achievement-stats {
    font-size: 14px; color: var(--muted);
    margin-bottom: 16px;
  }
  .achievement-stats span {
    background: rgba(160,115,70,0.15);
    padding: 4px 14px;
    border-radius: 12px;
    margin-right: 10px;
  }
  .achievement-list {
    display: flex; flex-direction: column; gap: 10px;
  }
  .achievement-item {
    display: flex; align-items: center;
    background: rgba(0,0,0,0.2);
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid transparent;
    transition: border-color 0.2s;
    gap: 14px;
  }
  .achievement-item.unlocked {
    border-color: var(--achievement-gold);
    background: rgba(255,215,0,0.08);
  }
  .achievement-item.locked {
    opacity: 0.4;
    background: rgba(0,0,0,0.4);
  }
  .achievement-item.locked .achievement-name,
  .achievement-item.locked .achievement-desc {
    color: #222;
    filter: blur(3px);
    user-select: none;
  }
  .achievement-icon {
    font-size: 28px;
    width: 44px;
    text-align: center;
    flex-shrink: 0;
  }
  .achievement-item.locked .achievement-icon {
    filter: grayscale(1) brightness(0.2);
  }
  .achievement-info {
    flex: 1;
  }
  .achievement-name {
    font-size: 15px; font-weight: 700; color: var(--text);
  }
  .achievement-desc {
    font-size: 12px; color: var(--muted);
  }
  .achievement-status {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 12px;
    flex-shrink: 0;
  }
  .achievement-status.unlocked {
    color: var(--achievement-gold);
    background: rgba(255,215,0,0.15);
  }
  .achievement-status.locked {
    color: var(--muted);
    background: rgba(0,0,0,0.3);
  }

  .achievement-close-btn {
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--muted);
    padding: 8px 24px;
    border-radius: 6px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    margin-top: 16px;
    align-self: center;
  }
  .achievement-close-btn:hover {
    border-color: var(--text);
    color: var(--text);
  }

  /* ---------- Shop/Setting Modal Overlay ---------- */
  #shop-overlay, #settings-overlay {
    position: fixed; inset: 0;
    background: rgba(20, 24, 18, 0.92);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #shop-overlay.active, #settings-overlay.active {
    opacity: 1; pointer-events: auto;
  }
  .shop-card, .settings-card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 16px;
    padding: 32px 36px;
    display: flex; flex-direction: column;
    width: 100%; max-width: 520px;
    max-height: 80vh;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    transform: translateY(16px);
    transition: transform 0.3s ease;
    z-index: 201;
    overflow-y: auto;
  }
  #shop-overlay.active .shop-card,
  #settings-overlay.active .settings-card {
    transform: translateY(0);
  }
  .shop-title, .settings-title { font-size: 22px; font-weight: 700; color: var(--text); margin: 0 0 4px 0; letter-spacing: 0.05em; }
  .shop-subtitle { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
  .shop-currency {
    display: flex; flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
    font-size: 14px; color: var(--gold-soft);
  }
  .shop-currency span {
    background: rgba(160,115,70,0.15);
    padding: 4px 14px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .shop-warning {
    font-size: 12px; color: var(--vermillion); 
    background: rgba(193,85,75,0.1); 
    padding: 8px 14px; border-radius: 8px;
    margin-bottom: 16px;
    border: 1px solid rgba(193,85,75,0.2);
    text-align: center;
  }
  .shop-section-title{
    font-size:16px; font-weight:700; color:var(--text);
    margin:16px 0 12px 0; padding-bottom:8px;
    border-bottom:1px solid var(--panel-edge);
  }
  .shop-items{ display:flex; flex-direction:column; gap:10px; }
  .shop-item{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(0,0,0,0.2); padding:12px 16px; border-radius:10px;
    border:1px solid transparent; transition:border-color 0.2s;
  }
  .shop-item.owned{ border-color:var(--jade); background:rgba(120,156,104,0.1); }
  .shop-item.equipped{ border-color:var(--gold); background:rgba(160,115,70,0.15); }
  .shop-item-info{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; flex:1; }
  .shop-item-name{ font-size:15px; font-weight:700; color:var(--text); }
  .shop-item-desc{ font-size:12px; color:var(--muted); }
  .shop-item-price{ font-size:13px; color:var(--gold-soft); margin-right:12px; }
  .shop-item-btn{
    background:var(--gold); border:none; color:var(--ink);
    padding:6px 16px; border-radius:6px;
    font-family:'Zen Maru Gothic', sans-serif; font-size:13px; font-weight:700;
    cursor:pointer; transition:opacity 0.2s;
    white-space:nowrap;
  }
  .shop-item-btn:hover{ opacity:0.8; }
  .shop-item-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .shop-item-btn.equip-btn{ background:var(--jade); }
  .shop-item-btn.owned-btn{ background:var(--muted); }

  .shop-close-btn, .settings-close-btn {
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--muted);
    padding: 8px 24px;
    border-radius: 6px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    margin-top: 16px;
    align-self:center;
  }
  .shop-close-btn:hover, .settings-close-btn:hover {
    border-color: var(--text);
    color: var(--text);
  }

  /* ---------- 設定項目 ---------- */
  .setting-group {
    width: 100%;
    margin: 4px 0;
  }
  .setting-group label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
    text-align: left;
  }
  .setting-group .sound-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .setting-group .sound-row input[type="file"] {
    display: none;
  }
  .setting-group .sound-row .sound-file-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--gold-soft);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .setting-group .sound-row .sound-file-btn:hover {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
  }
  .setting-group .sound-row .file-name {
    font-size: 11px;
    color: var(--muted);
    width: 100%;
    text-align: left;
    margin-top: 2px;
    min-height: 16px;
  }
  .setting-group .sound-row input[type="text"] {
    flex: 1;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--panel-edge);
    background: var(--ink);
    color: var(--text);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    transition: border-color 0.2s;
    min-width: 0;
  }
  .setting-group .sound-row input[type="text"]:focus {
    outline: none;
    border-color: var(--gold);
  }
  .setting-group .sound-row input[type="text"]::placeholder {
    color: var(--muted);
    opacity: 0.5;
  }
  .setting-group .sound-exec-btn {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid var(--gold);
    background: var(--gold);
    color: var(--ink);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .setting-group .sound-exec-btn:hover {
    opacity: 0.8;
  }
  .setting-group .sound-status {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    min-height: 18px;
  }
  .setting-group .sound-status.success {
    color: var(--jade);
  }
  .setting-group .sound-status.error {
    color: var(--vermillion);
  }

  /* ---------- コード入力エリア ---------- */
  .code-area {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--panel-edge);
    width: 100%;
  }
  .code-area .code-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .code-area .code-row input[type="password"] {
    flex: 1;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--panel-edge);
    background: var(--ink);
    color: var(--text);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    transition: border-color 0.2s;
    min-width: 0;
  }
  .code-area .code-row input[type="password"]:focus {
    outline: none;
    border-color: var(--gold);
  }
  .code-area .code-row .code-btn {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid var(--gold);
    background: var(--gold);
    color: var(--ink);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .code-area .code-row .code-btn:hover { opacity: 0.8; }
  .code-area .code-status {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    min-height: 18px;
  }
  .code-area .code-status.success { color: var(--jade); }
  .code-area .code-status.error { color: var(--vermillion); }

  /* ---------- Menu ---------- */
  .menu-center{ display:flex; flex-direction:column; align-items:center; gap:20px; width:100%; z-index:20; position:relative; }
  .title{
    font-size:clamp(34px,7vw,52px);
    font-weight:700;
    margin:0;
    letter-spacing:0.08em;
    position:relative;
    padding-bottom:16px;
    color: var(--gold-soft);
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .title::after{
    content:"";
    position:absolute; bottom:0; left:50%;
    width:120px; height:4px;
    background:linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold-soft) 50%, var(--gold) 80%, transparent);
    transform:translateX(-50%) skewX(-18deg);
    border-radius:2px;
  }
  .tagline{
    font-size:15px; line-height:1.9; color:var(--muted);
    max-width:420px; margin:0;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .start-prompt{
    margin-top:8px;
    display:flex; align-items:center; gap:10px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:14px; color:var(--gold-soft);
    padding:10px 20px;
    border:1px solid var(--panel-edge);
    border-radius:8px;
    background:rgba(28,36,25,0.8);
    backdrop-filter: blur(4px);
  }
  kbd{
    font-family:'Zen Maru Gothic', sans-serif;
    background:var(--ink);
    border:1px solid var(--gold);
    color:var(--gold-soft);
    padding:4px 10px;
    border-radius:5px;
    font-size:13px;
    font-weight:700;
  }

  /* ---------- Game ---------- */
  #game-screen{ max-width:720px; z-index:20; position:relative; }
  .hud{
    width:100%; display:flex; justify-content:space-between; align-items:flex-start;
    font-family:'Zen Maru Gothic', sans-serif;
    margin-bottom:36px;
  }
  .hud-timer{ display:flex; align-items:baseline; gap:4px; color:var(--text); }
  #timer{ font-size:34px; font-weight:700; }
  .hud-timer.low #timer{ color:var(--vermillion); }
  .hud-unit{ font-size:13px; color:var(--muted); }
  .hud-score{ text-align:right; }
  .score-value{ font-size:34px; font-weight:700; color:var(--gold-soft); }
  .multiplier{ font-size:14px; color:var(--jade); margin-top:2px; }

  .word-stage{
    width:100%;
    background:rgba(28,36,25,0.85);
    backdrop-filter: blur(6px);
    border:1px solid var(--panel-edge);
    border-radius:10px;
    padding:44px 28px;
    display:flex; flex-direction:column; align-items:center; gap:18px;
    position:relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .word-stage.shake{ animation:shake 0.22s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }
  .kana-display{ font-size:clamp(30px,6vw,44px); font-weight:700; letter-spacing:0.06em; }
  .romaji-display{ font-family:'Zen Maru Gothic', sans-serif; font-size:clamp(18px,4vw,24px); font-weight:700; letter-spacing:0.04em; }
  .ch-done{ color:var(--jade); }
  .ch-next{ color:var(--paper); border-bottom:2px solid var(--gold); }
  .ch-pending{ color:var(--muted); }

  .popup{
    position:absolute; top:-6px; left:50%; transform:translate(-50%,-100%);
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:15px; font-weight:700; color:var(--gold-soft);
    opacity:0; pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
  }
  .popup.show{ opacity:1; transform:translate(-50%,-140%); }

  // --- デフォルト音声（Web Audioで生成） ---
  function generateDefaultSound(type) {
    if (!audioCtx) return null;
    try {
      const duration = type === 'bgm' ? 0.5 : (type === 'typed' ? 0.1 : type === 'start' ? 0.2 : 0.4);
      const sampleRate = audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);
      
      if (type === 'bgm') {
        for (let i = 0; i < data.length; i++) {
          const t = i / sampleRate;
          const note = Math.sin(2 * Math.PI * 440 * t) * 0.15 +
                       Math.sin(2 * Math.PI * 554 * t) * 0.1 +
                       Math.sin(2 * Math.PI * 659 * t) * 0.08;
          data[i] = note * Math.exp(-t * 2) * 0.3;
        }
      } else if (type === 'typed') {
        for (let i = 0; i < data.length; i++) {
          const t = i / sampleRate;
          data[i] = Math.sin(2 * Math.PI * 800 * t) * Math.exp(-t * 40) * 0.3;
        }
      } else if (type === 'start') {
        for (let i = 0; i < data.length; i++) {
          const t = i / sampleRate;
          const freq = 400 + t * 600;
          data[i] = Math.sin(2 * Math.PI * freq * t) * Math.exp(-t * 10) * 0.3;
        }
      } else if (type === 'result') {
        for (let i = 0; i < data.length; i++) {
          const t = i / sampleRate;
          const val = Math.sin(2 * Math.PI * 523 * t) * 0.15 +
                      Math.sin(2 * Math.PI * 659 * t) * 0.15 +
                      Math.sin(2 * Math.PI * 784 * t) * 0.15;
          data[i] = val * Math.exp(-t * 6) * 0.4;
        }
      }
      return buffer;
    } catch(e) {
      return null;
    }
  }

  function playSound(buffer, fallbackUrl, type) {
    if (buffer && audioCtx) {
      try {
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
        return source;
      } catch(e) {
        console.warn('Web Audio再生失敗、フォールバック試行:', e);
      }
    }
    // フォールバック: HTMLAudioElementで直接再生
    if (fallbackUrl) {
      try {
        let audio = soundAudioEls[type];
        if (!audio || audio.src !== fallbackUrl) {
          audio = new Audio(fallbackUrl);
          audio.preload = 'auto';
          audio.crossOrigin = 'anonymous';
          soundAudioEls[type] = audio;
        }
        audio.currentTime = 0;

        const doPlay = () => {
          const playPromise = audio.play();
          if (playPromise) {
            playPromise.catch(err => {
              console.warn('Audio play()失敗:', err.name, err.message);
            });
          }
        };

        if (audio.readyState >= 3) {
          doPlay();
        } else {
          audio.addEventListener('canplaythrough', doPlay, { once: true });
          audio.addEventListener('error', (e) => {
            console.warn('Audio読み込みエラー:', type, audio.error ? audio.error.code : 'unknown');
          }, { once: true });
          audio.load();
        }
        return audio;
      } catch(e) {
        console.warn('フォールバック再生失敗:', e);
      }
    }
    return null;
  }

        return;
      } catch(e) {
        console.warn('Web Audio BGM再生失敗、フォールバック試行:', e);
      }
    }
    // フォールバック: HTMLAudioElementでループ再生
    if (soundUrls.bgm) {
      try {
        let audio = soundAudioEls.bgm;
        if (!audio || audio.src !== soundUrls.bgm) {
          audio = new Audio(soundUrls.bgm);
          audio.preload = 'auto';
          audio.crossOrigin = 'anonymous';
          audio.loop = true;
          soundAudioEls.bgm = audio;
          bgmAudioEl = audio;
        }
        audio.currentTime = 0;
        const doPlay = () => {
          audio.play().catch(err => console.warn('BGM Audio要素再生失敗:', err));
        };
        if (audio.readyState >= 3) {
          doPlay();
        } else {
          audio.addEventListener('canplaythrough', doPlay, { once: true });
          audio.load();
        }
        isBgmPlaying = true;
      } catch(e) {
        console.warn('BGMフォールバック失敗:', e);
      }
    }
  }

  function stopBgm() {
    if (bgmSource) {
      try { bgmSource.stop(); } catch(e) {}
      bgmSource = null;
    }
    if (bgmAudioEl) {
      try { bgmAudioEl.pause(); bgmAudioEl.currentTime = 0; } catch(e) {}
    }
    if (soundAudioEls.bgm) {
      try { soundAudioEls.bgm.pause(); soundAudioEls.bgm.currentTime = 0; } catch(e) {}
    }
    isBgmPlaying = false;
  }

  // --- 音声設定用関数 ---
  async function applySoundSetting(type, url) {
    const statusEl = document.getElementById('status-' + type);
    statusEl.textContent = '⏳ 読み込み中...';
    statusEl.className = 'sound-status';

    try {
      if (!audioCtx) initAudio();
      
      let buffer = null;
      if (url && url.trim() !== '') {
        buffer = await loadSound(url.trim());
        if (buffer) {
          soundBuffers[type] = buffer;
          soundUrls[type] = url.trim();
          if (type === 'typed') soundTyped = url.trim();
          else if (type === 'start') soundStart = url.trim();
          else if (type === 'result') soundResult = url.trim();
          else if (type === 'bgm') soundBgm = url.trim();
          saveData();
          statusEl.textContent = '✅ 音声を設定しました (外部ファイル)';
          statusEl.className = 'sound-status success';
          if (type === 'bgm') {
            playBgmLoop();
          } else {
            playSound(buffer);
          }
        } else {
          statusEl.textContent = '❌ 音声の読み込みに失敗しました';
          statusEl.className = 'sound-status error';
        }
      } else {
        if (type === 'typed') soundTyped = '';
        else if (type === 'start') soundStart = '';
        else if (type === 'result') soundResult = '';
        else if (type === 'bgm') {
          soundBgm = '';
          stopBgm();
        }
        soundBuffers[type] = null;
        soundUrls[type] = '';
        saveData();
        const defaultBuffer = generateDefaultSound(type);
        if (defaultBuffer) {
          soundBuffers[type] = defaultBuffer;
          statusEl.textContent = '✅ デフォルト音声に設定しました';
          statusEl.className = 'sound-status success';
          if (type === 'bgm') {
            playBgmLoop();
          } else {
            playSound(defaultBuffer, '', type);
          }
        }
      }
    } catch(e) {
      statusEl.textContent = '❌ エラー: ' + e.message;
      statusEl.className = 'sound-status error';
    }
  }

      villageHouses.push({

        roofColor: ['#8b5a2b', '#a0522d', '#6b3a1f', '#7a4a2a'][Math.floor(Math.random() * 4)],
        hasChimney: Math.random() > 0.6,
      });
