    for (let i = 0; i < 6; i++) {
      fireworks.push({
        x: 50 + Math.random() * (forestCanvas.width - 100),
        y: 50 + Math.random() * (forestCanvas.height * 0.4),
        radius: 0,
        maxRadius: 20 + Math.random() * 40,
        life: Math.random() * 0.5,
        speed: 0.005 + Math.random() * 0.01,
        hue: Math.random() * 360,
        particles: [],
        active: false,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function drawForest() {
    fCtx.clearRect(0, 0, forestCanvas.width, forestCanvas.height);

    // 野獣先輩背景
    if (equippedBg === 'beast_room') {
      // 白い壁
      fCtx.fillStyle = '#F5F5F5';
      fCtx.fillRect(0, 0, forestCanvas.width, forestCanvas.height);
      
      // 床の線（白い壁に少し影）
      fCtx.strokeStyle = 'rgba(0,0,0,0.03)';
      fCtx.lineWidth = 1;
      for (let i = 0; i < 30; i++) {
        const y = forestCanvas.height * 0.7 + i * (forestCanvas.height * 0.3 / 30);
        fCtx.beginPath();
        fCtx.moveTo(0, y);
        fCtx.lineTo(forestCanvas.width, y);
        fCtx.stroke();
      }
      
      // 緑のカーテン（左右）
      const curtainColor = '#2E8B57';
      const curtainW = forestCanvas.width * 0.08;
      const curtainH = forestCanvas.height * 0.85;
      // 左カーテン
      fCtx.fillStyle = curtainColor;
      fCtx.shadowColor = 'rgba(0,0,0,0.1)';
      fCtx.shadowBlur = 8;
      fCtx.fillRect(0, 0, curtainW, curtainH);
      // カーテンのひだ
      for (let i = 0; i < 6; i++) {
        const cx = i * (curtainW / 6);
        fCtx.fillStyle = 'rgba(0,0,0,0.08)';
        fCtx.fillRect(cx, 0, 2, curtainH);
      }
      // 右カーテン
      fCtx.fillStyle = curtainColor;
      fCtx.fillRect(forestCanvas.width - curtainW, 0, curtainW, curtainH);
      for (let i = 0; i < 6; i++) {
        const cx = forestCanvas.width - curtainW + i * (curtainW / 6);
        fCtx.fillStyle = 'rgba(0,0,0,0.08)';
        fCtx.fillRect(cx, 0, 2, curtainH);
      }
      
      // カーテンの上部（レール）
      fCtx.fillStyle = '#4a4a4a';
      fCtx.shadowBlur = 0;
      fCtx.fillRect(0, 0, forestCanvas.width, 6);
      
      // ソファー（茶色）
      fCtx.shadowBlur = 12;
      fCtx.shadowColor = 'rgba(0,0,0,0.15)';
      const sofaX = forestCanvas.width * 0.15;
      const sofaY = forestCanvas.height * 0.62;
      const sofaW = forestCanvas.width * 0.7;
      const sofaH = forestCanvas.height * 0.25;
      
      // ソファー本体
      fCtx.fillStyle = '#8B4513';
      fCtx.fillRect(sofaX, sofaY, sofaW, sofaH);
      
      // ソファーの背もたれ
      fCtx.fillStyle = '#A0522D';
      fCtx.fillRect(sofaX, sofaY - sofaH * 0.2, sofaW, sofaH * 0.2);
      
      // ソファーの肘掛け
      fCtx.fillStyle = '#6B3410';
      fCtx.fillRect(sofaX, sofaY, sofaW * 0.06, sofaH);
      fCtx.fillRect(sofaX + sofaW - sofaW * 0.06, sofaY, sofaW * 0.06, sofaH);
      
      // ソファーの座面の線
      fCtx.shadowBlur = 0;
      fCtx.strokeStyle = 'rgba(0,0,0,0.05)';
      fCtx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        const lx = sofaX + sofaW * 0.05 + i * (sofaW * 0.9 / 4);
        fCtx.beginPath();
        fCtx.moveTo(lx, sofaY + sofaH * 0.05);
        fCtx.lineTo(lx, sofaY + sofaH * 0.95);
        fCtx.stroke();
      }
      
      // ソファーの影
      fCtx.shadowBlur = 0;
      fCtx.fillStyle = 'rgba(0,0,0,0.03)';
      fCtx.fillRect(sofaX + sofaW * 0.02, sofaY + sofaH, sofaW * 0.96, sofaH * 0.05);
      
      // 床の境界線
      fCtx.strokeStyle = 'rgba(0,0,0,0.05)';
      fCtx.lineWidth = 2;
      fCtx.beginPath();
      fCtx.moveTo(0, forestCanvas.height * 0.7);
      fCtx.lineTo(forestCanvas.width, forestCanvas.height * 0.7);
      fCtx.stroke();
      
      requestAnimationFrame(drawForest);
      return;
    }

    const bg = BG_SKINS[equippedBg] || BG_SKINS['forest'];
    let colors;
    let gradientColors = [];
    
    switch(equippedBg) {
      case 'summer_festival':
        gradientColors = ['#0a0515', '#1a0a2e', '#2d1b4e', '#1a0a2e'];
        break;
      case 'republic':
        gradientColors = ['#87CEEB', '#4A90D9', '#2E7AB3', '#87CEEB'];
        break;
      case 'sunset':
        colors = ['#1a0a0a', '#3d1a0a', '#6b2a15'];
        break;
      case 'ocean':
        colors = ['#0a1a2a', '#0d2a4a', '#1a4a6a'];
        break;
      case 'everest':
        colors = ['#0a1a3a', '#1a3a6a', '#3a7aaa'];
        break;
      case 'sakura':
        colors = ['#1a0a1a', '#3a1a2a', '#5a2a3a'];
        break;
      case 'aurora':
        colors = ['#0a0a1a', '#1a0a3a', '#0a2a3a'];
        break;
      case 'nightcity':
        colors = ['#0a0a14', '#1a0a28', '#2a0a3a'];
        break;
      case 'waterfall':
        colors = ['#0a1a0a', '#1a3a1a', '#2a5a2a'];
        break;
      case 'desert':
        colors = ['#1a0a0a', '#3a2a0a', '#5a3a0a'];
        break;
      case 'starry':
        colors = ['#050510', '#0a0a25', '#0a0a3a'];
        break;
      default:
        colors = ['#0d120a', '#182215'];
    }

    const bgGrad = fCtx.createLinearGradient(0, 0, 0, forestCanvas.height);
    if (gradientColors.length > 0) {
      gradientColors.forEach((c, i) => {
        bgGrad.addColorStop(i / (gradientColors.length - 1), c);
      });
    } else {
      bgGrad.addColorStop(0, colors[0]);
      bgGrad.addColorStop(0.5, colors[1] || colors[0]);
      bgGrad.addColorStop(1, colors[2] || colors[1] || colors[0]);
    }
    fCtx.fillStyle = bgGrad;
    fCtx.fillRect(0, 0, forestCanvas.width, forestCanvas.height);

    if (equippedBg === 'summer_festival') {
      fireworks.forEach(fw => {
        fw.phase += 0.02;
        if (fw.phase % 0.5 < 0.01 && !fw.active) {
          fw.active = true;
          fw.x = 50 + Math.random() * (forestCanvas.width - 100);
          fw.y = 50 + Math.random() * (forestCanvas.height * 0.4);
          fw.maxRadius = 20 + Math.random() * 50;
          fw.hue = Math.random() * 360;
          fw.particles = [];
          for (let i = 0; i < 30; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 3;
            fw.particles.push({
              x: 0, y: 0,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 1,
              decay: 0.005 + Math.random() * 0.01,
              size: 2 + Math.random() * 3,
              hue: fw.hue + (Math.random() - 0.5) * 60,
            });
          }
        }
        if (fw.active) {
          const progress = fw.phase % 0.5 / 0.5;
          fw.radius = fw.maxRadius * progress;
          
          fw.particles.forEach(p => {
            p.x += p.vx * 0.5;
            p.y += p.vy * 0.5;
            p.life -= p.decay;
            p.size *= 0.99;
          });
          fw.particles = fw.particles.filter(p => p.life > 0);
          
          if (fw.particles.length === 0) {
            fw.active = false;
          }
          
          fw.particles.forEach(p => {
            fCtx.save();
            fCtx.globalAlpha = p.life * 0.8;
            fCtx.fillStyle = `hsl(${p.hue}, 100%, 70%)`;
            fCtx.shadowColor = `hsl(${p.hue}, 100%, 50%)`;
            fCtx.shadowBlur = 15;
            fCtx.beginPath();
            fCtx.arc(fw.x + p.x, fw.y + p.y, p.size, 0, Math.PI * 2);
            fCtx.fill();
            fCtx.restore();
          });
        }
      });

      for (let i = 0; i < 8; i++) {
        const x = 30 + i * (forestCanvas.width - 60) / 7;
        const y = forestCanvas.height * 0.6 + Math.sin(i * 1.2) * 20;
        fCtx.save();
        const glow = 0.6 + Math.sin(Date.now() / 500 + i) * 0.2;
        fCtx.shadowColor = `rgba(255, 150, 50, ${glow * 0.5})`;
        fCtx.shadowBlur = 30;
        fCtx.fillStyle = `rgba(255, 100, 50, ${glow * 0.7})`;
        fCtx.beginPath();
        fCtx.ellipse(x, y, 12, 18, 0, 0, Math.PI * 2);
        fCtx.fill();
        fCtx.fillStyle = `rgba(255, 200, 100, ${glow * 0.3})`;
        fCtx.beginPath();
        fCtx.ellipse(x, y, 6, 10, 0, 0, Math.PI * 2);
        fCtx.fill();
        fCtx.restore();
      }

      for (let i = 0; i < 5; i++) {
        const x = 80 + i * (forestCanvas.width - 160) / 4;
        const y = forestCanvas.height * 0.72;
        fCtx.fillStyle = '#5a3a2a';
        fCtx.fillRect(x, y, 50, 30);
        fCtx.fillStyle = '#8a5a3a';
        fCtx.fillRect(x + 5, y - 15, 40, 15);
        fCtx.fillStyle = '#ffcc66';
        fCtx.fillRect(x + 10, y - 10, 8, 10);
        fCtx.fillRect(x + 30, y - 10, 8, 10);
      }
    }

    if (equippedBg === 'republic') {
      villageHouses.forEach(house => {
        fCtx.save();
        fCtx.shadowColor = 'rgba(0,0,0,0.2)';
        fCtx.shadowBlur = 10;
        fCtx.fillStyle = house.color;
        fCtx.fillRect(house.x - house.w/2, house.y - house.h, house.w, house.h);
        fCtx.fillStyle = house.roofColor;
        fCtx.beginPath();
        fCtx.moveTo(house.x - house.w/2 - 5, house.y - house.h);
        fCtx.lineTo(house.x, house.y - house.h - house.w * 0.4);
        fCtx.lineTo(house.x + house.w/2 + 5, house.y - house.h);
        fCtx.closePath();
        fCtx.fill();
        if (house.hasChimney) {
          fCtx.fillStyle = '#6b4a2a';
          fCtx.fillRect(house.x + house.w/4, house.y - house.h - house.w * 0.3, 8, 15);
          if (Math.random() > 0.7) {
            fCtx.fillStyle = 'rgba(200,200,200,0.1)';
            fCtx.beginPath();
            fCtx.arc(house.x + house.w/4 + 4, house.y - house.h - house.w * 0.3 - 10, 10 + Math.random() * 8, 0, Math.PI * 2);
            fCtx.fill();
          }
        }
        fCtx.shadowBlur = 0;
        fCtx.fillStyle = '#ffdd88';
        fCtx.fillRect(house.x - house.w/4 - 4, house.y - house.h * 0.6, 8, 10);
        fCtx.fillRect(house.x + house.w/4 - 4, house.y - house.h * 0.6, 8, 10);
        fCtx.fillStyle = '#4a2a1a';
        fCtx.fillRect(house.x - 6, house.y - 20, 12, 20);
        fCtx.restore();
      });

      fCtx.save();
      fCtx.fillStyle = 'rgba(180,160,130,0.3)';
      fCtx.beginPath();
      fCtx.moveTo(0, forestCanvas.height * 0.8);
      fCtx.quadraticCurveTo(forestCanvas.width * 0.3, forestCanvas.height * 0.7, forestCanvas.width * 0.5, forestCanvas.height * 0.75);
      fCtx.quadraticCurveTo(forestCanvas.width * 0.7, forestCanvas.height * 0.8, forestCanvas.width, forestCanvas.height * 0.7);
      fCtx.lineTo(forestCanvas.width, forestCanvas.height);
      fCtx.lineTo(0, forestCanvas.height);
      fCtx.closePath();
      fCtx.fill();
      fCtx.restore();

      fCtx.save();
      fCtx.fillStyle = '#2a5a2a';
      fCtx.fillRect(forestCanvas.width * 0.7, forestCanvas.height * 0.4, 4, 40);
      fCtx.fillStyle = '#ffd700';
      fCtx.font = '20px sans-serif';
      fCtx.fillText('🌰', forestCanvas.width * 0.7 - 15, forestCanvas.height * 0.4 - 5);
      fCtx.restore();

      fCtx.save();
      fCtx.fillStyle = 'rgba(255,255,255,0.15)';
      fCtx.font = 'bold 28px "Zen Maru Gothic", sans-serif';
      fCtx.textAlign = 'center';
      fCtx.fillText('どんぐり共和国', forestCanvas.width * 0.5, 60);
      fCtx.restore();

      for (let i = 0; i < 5; i++) {
        const x = ((i * 200 + Date.now() * 0.01) % (forestCanvas.width + 100)) - 50;
        const y = 30 + i * 30 % 80;
        fCtx.save();
        fCtx.globalAlpha = 0.3;
        fCtx.fillStyle = 'white';
        fCtx.beginPath();
        fCtx.arc(x, y, 40, 0, Math.PI * 2);
        fCtx.arc(x + 40, y - 10, 35, 0, Math.PI * 2);
        fCtx.arc(x + 70, y, 30, 0, Math.PI * 2);
        fCtx.fill();
        fCtx.restore();
      }
    }

    const treeOpacity = equippedBg === 'republic' ? 0.5 : 1.0;
    trees.forEach(t => {
      t.sway += t.swaySpeed;
      const swayOffset = Math.sin(t.sway) * 4;

      fCtx.save();
      fCtx.globalAlpha = treeOpacity;
      const isSakura = (equippedBg === 'sakura' && t.color === 'sakura');
      if(t.layer === 1) {
        fCtx.fillStyle = isSakura ? 'rgba(60,30,40,0.5)' : 'rgba(25,38,22,0.45)';
      } else {
        fCtx.fillStyle = isSakura ? 'rgba(80,40,50,0.7)' : 'rgba(32,48,28,0.75)';
      }

      fCtx.beginPath();
      fCtx.moveTo(t.x - t.width * 0.2, forestCanvas.height);
      fCtx.lineTo(t.x + t.width * 0.2, forestCanvas.height);
      fCtx.lineTo(t.x + t.width * 0.1 + swayOffset * 0.5, forestCanvas.height - t.height * 0.5);
      fCtx.lineTo(t.x - t.width * 0.1 + swayOffset * 0.5, forestCanvas.height - t.height * 0.5);
      fCtx.fill();

      const crownY = forestCanvas.height - t.height * 0.6;
      if(isSakura) {
        fCtx.fillStyle = 'rgba(200,120,140,0.6)';
        for(let j=0; j<5; j++) {
          const angle = (j/5)*Math.PI*2 + t.sway*0.1;
          fCtx.beginPath();
          fCtx.arc(t.x + swayOffset + Math.cos(angle)*t.width*0.5, crownY + Math.sin(angle)*t.width*0.3, t.width*0.3, 0, Math.PI*2);
          fCtx.fill();
        }
      } else {
        fCtx.beginPath();
        fCtx.arc(t.x + swayOffset, crownY, t.width * 0.9, 0, Math.PI * 2);
        fCtx.arc(t.x - t.width * 0.4 + swayOffset, crownY + 20, t.width * 0.7, 0, Math.PI * 2);
        fCtx.arc(t.x + t.width * 0.4 + swayOffset, crownY + 20, t.width * 0.7, 0, Math.PI * 2);
        fCtx.fill();
      }
      fCtx.restore();
    });

    if(equippedBg === 'everest') {
      fCtx.save();
      fCtx.fillStyle = 'rgba(200,210,220,0.15)';
      fCtx.beginPath();
      fCtx.moveTo(0, forestCanvas.height * 0.7);
      fCtx.quadraticCurveTo(forestCanvas.width * 0.2, forestCanvas.height * 0.3, forestCanvas.width * 0.4, forestCanvas.height * 0.5);
      fCtx.quadraticCurveTo(forestCanvas.width * 0.5, forestCanvas.height * 0.2, forestCanvas.width * 0.6, forestCanvas.height * 0.45);
      fCtx.quadraticCurveTo(forestCanvas.width * 0.8, forestCanvas.height * 0.35, forestCanvas.width, forestCanvas.height * 0.55);
      fCtx.lineTo(forestCanvas.width, forestCanvas.height);
      fCtx.lineTo(0, forestCanvas.height);
      fCtx.fill();

      fCtx.fillStyle = 'rgba(255,255,255,0.08)';
      fCtx.beginPath();
      fCtx.moveTo(forestCanvas.width * 0.3, forestCanvas.height * 0.5);
      fCtx.quadraticCurveTo(forestCanvas.width * 0.45, forestCanvas.height * 0.25, forestCanvas.width * 0.55, forestCanvas.height * 0.4);
      fCtx.quadraticCurveTo(forestCanvas.width * 0.65, forestCanvas.height * 0.3, forestCanvas.width * 0.75, forestCanvas.height * 0.45);
      fCtx.lineTo(forestCanvas.width * 0.75, forestCanvas.height);
      fCtx.lineTo(forestCanvas.width * 0.3, forestCanvas.height);
      fCtx.fill();
      fCtx.restore();
    }

    if(equippedBg === 'nightcity') {
      fCtx.save();
      for(let i=0; i<20; i++) {
        const x = Math.random() * forestCanvas.width;
        const y = forestCanvas.height * (0.5 + Math.random() * 0.4);
        const w = 3 + Math.random() * 8;
        const h = 5 + Math.random() * 20;
        fCtx.fillStyle = `rgba(255,200,50,${0.1 + Math.random() * 0.2})`;
        fCtx.fillRect(x, y, w, h);
      }
      fCtx.restore();
    }

    if(equippedBg === 'starry') {
      fCtx.save();
      for(let i=0; i<100; i++) {
        const x = Math.random() * forestCanvas.width;
        const y = Math.random() * forestCanvas.height * 0.6;
        const size = 0.5 + Math.random() * 1.5;
        const alpha = 0.3 + Math.random() * 0.7;
        fCtx.fillStyle = `rgba(255,255,255,${alpha * 0.5})`;
        fCtx.beginPath();
        fCtx.arc(x, y, size, 0, Math.PI * 2);
        fCtx.fill();
      }
      fCtx.restore();
    }

    requestAnimationFrame(drawForest);
  }

  // ============ どんぐり描画システム ============
  function resizeCanvas() {
    acornCanvas.width = window.innerWidth;
    acornCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', () => { resizeCanvas(); initForest(); });
  resizeCanvas();
  initForest();
  requestAnimationFrame(drawForest);

  function getAcornStyle(skin) {
    const styles = {
      'default': { cap: '#654321', nut: '#a07346', glow: null, particleColors: ['#654321', '#a07346', '#8B6B3D'] },
      'green': { cap: '#2d5a1a', nut: '#4a8a2a', glow: 'rgba(74,138,42,0.3)', particleColors: ['#2d5a1a', '#4a8a2a', '#6aaa4a'] },
      'gold': { cap: '#b8860b', nut: '#ffd700', glow: 'rgba(255,215,0,0.4)', particleColors: ['#ffd700', '#ffaa00', '#ffcc33'] },
      'crystal': { cap: '#4a6a8a', nut: '#8ac4d0', glow: 'rgba(138,196,208,0.4)', particleColors: ['#8ac4d0', '#aaddff', '#66aacc'] },
      'flame': { cap: '#8a2a0a', nut: '#ff4a1a', glow: 'rgba(255,74,26,0.4)', particleColors: ['#ff4a1a', '#ff8a00', '#ffcc00'] },
      'bubble': { cap: '#2a5a3a', nut: '#4aaa6a', glow: 'rgba(74,170,106,0.3)', particleColors: ['#4aaa6a', '#66dd88', '#88ffaa'] },
      'rainbow': { cap: '#ff6b6b', nut: '#ffd93d', glow: 'rgba(255,100,100,0.3)', particleColors: ['#ff6b6b', '#ffd93d', '#6bcfff', '#ff6bff'] },
      'ice': { cap: '#3a6a8a', nut: '#8ac4e0', glow: 'rgba(138,196,224,0.4)', particleColors: ['#8ac4e0', '#cceeff', '#66aacc'] },
      'dark': { cap: '#2a0a3a', nut: '#6a2a8a', glow: 'rgba(106,42,138,0.4)', particleColors: ['#6a2a8a', '#9a4aaa', '#3a0a5a'] },
      'light': { cap: '#8a8a8a', nut: '#f0f0ff', glow: 'rgba(255,255,255,0.4)', particleColors: ['#f0f0ff', '#ffffff', '#ccccdd'] },
      'cosmic': { cap: '#1a0a3a', nut: '#4a1a6a', glow: 'rgba(74,26,106,0.5)', particleColors: ['#4a1a6a', '#8a3aaa', '#1a0a3a', '#aa6acc'] },
      'phantom': { cap: '#4a1a6a', nut: '#8a4aaa', glow: 'rgba(155,89,182,0.6)', particleColors: ['#8a4aaa', '#bb66dd', '#6a2a8a', '#dd88ff'] },
      'double': { cap: '#654321', nut: '#a07346', glow: 'rgba(255,215,0,0.3)', particleColors: ['#654321', '#a07346', '#8B6B3D'] },
      'beast': { cap: '#8B6B3D', nut: '#1a2a4a', glow: 'rgba(255,255,255,0.4)', particleColors: ['#ffffff', '#eeeeee', '#dddddd'] },
    };
    return styles[skin] || styles['default'];
  }

  function spawnAcornTop() {
    const x = Math.random() * (window.innerWidth - 60) + 30;
    const y = 15;
    const skin = equippedAcorn;
    acorns.push({
      x, y,
      vx: (Math.random() - 0.5) * 1.5,
      vy: Math.random() * 0.5,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.05 + Math.random() * 0.05,
      scale: 0.7 + Math.random() * 0.5,
      skin: skin,
      bubblePhase: Math.random() * Math.PI * 2,
      hue: Math.random() * 360,
      variation: 0.8 + Math.random() * 0.4,
    });
  }

  function drawAcorn(ctx, a) {
    const skin = ACORN_SKINS[a.skin] || ACORN_SKINS['default'];
    const style = getAcornStyle(a.skin);
    const currentX = a.x + Math.sin(a.wobble) * 3;
    const currentY = a.y;

    ctx.save();
    ctx.translate(currentX, currentY);
    ctx.scale(a.scale * a.variation, a.scale * a.variation);

    if (a.skin === 'phantom') {
      a.hue = (a.hue + 0.5) % 360;
      const hue = (a.hue + 240) % 360;
      
      ctx.shadowColor = `hsl(${hue}, 80%, 60%)`;
      ctx.shadowBlur = 40;
      
      const grad = ctx.createRadialGradient(-3, 5, 2, 0, 8, 14);
      grad.addColorStop(0, `hsl(${hue}, 90%, 75%)`);
      grad.addColorStop(0.5, `hsl(${hue}, 85%, 55%)`);
      grad.addColorStop(1, `hsl(${(hue + 30) % 360}, 80%, 35%)`);
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 10, 10, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 20;
      ctx.fillStyle = `hsl(${(hue + 20) % 360}, 70%, 25%)`;
      ctx.beginPath();
      ctx.arc(0, 3, 11, Math.PI, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      a.bubblePhase += 0.03;
      for (let i = 0; i < 6; i++) {
        const angle = a.bubblePhase + i * 1.05;
        const dist = 10 + Math.sin(a.bubblePhase * 0.5 + i * 1.3) * 4;
        const size = 2 + Math.sin(a.bubblePhase * 0.7 + i * 0.9) * 1.5;
        const alpha = 0.3 + Math.sin(a.bubblePhase * 0.6 + i * 1.1) * 0.3;
        ctx.fillStyle = `hsla(${(hue + i * 60) % 360}, 100%, 80%, ${alpha})`;
        ctx.beginPath();
        const cx = Math.cos(angle) * dist;
        const cy = Math.sin(angle) * dist * 0.6 + 5;
        for (let j = 0; j < 5; j++) {
          const starAngle = (j / 5) * Math.PI * 2 - Math.PI / 2 + a.bubblePhase * 0.2;
          const r = j % 2 === 0 ? size * 1.8 : size * 0.7;
          if (j === 0) ctx.moveTo(cx + Math.cos(starAngle) * r, cy + Math.sin(starAngle) * r);
          else ctx.lineTo(cx + Math.cos(starAngle) * r, cy + Math.sin(starAngle) * r);
        }
        ctx.closePath();
        ctx.fill();
      }

      ctx.shadowColor = `hsl(${hue}, 100%, 70%)`;
      ctx.shadowBlur = 25;
      ctx.fillStyle = `hsla(${hue}, 100%, 90%, 0.4)`;
      ctx.beginPath();
      ctx.arc(0, 6, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      return;
    }

    if (a.skin === 'rainbow') {
      a.hue = (a.hue + 0.8) % 360;
      const hue1 = a.hue;
      const hue2 = (a.hue + 60) % 360;
      const hue3 = (a.hue + 120) % 360;
      
      const grad = ctx.createRadialGradient(-4, 6, 2, 0, 10, 14);
      grad.addColorStop(0, `hsl(${hue1}, 100%, 70%)`);
      grad.addColorStop(0.4, `hsl(${hue2}, 100%, 65%)`);
      grad.addColorStop(0.8, `hsl(${hue3}, 100%, 60%)`);
      grad.addColorStop(1, `hsl(${(a.hue + 180) % 360}, 100%, 50%)`);
      
      ctx.fillStyle = grad;
      ctx.shadowColor = `hsl(${a.hue}, 100%, 70%)`;
      ctx.shadowBlur = 30;
      ctx.beginPath();
      ctx.ellipse(0, 10, 9, 11, 0, 0, Math.PI * 2);
      ctx.fill();

      const grad2 = ctx.createRadialGradient(0, 0, 2, 0, 3, 10);
      grad2.addColorStop(0, `hsl(${(a.hue + 30) % 360}, 100%, 75%)`);
      grad2.addColorStop(0.5, `hsl(${(a.hue + 90) % 360}, 100%, 65%)`);
      grad2.addColorStop(1, `hsl(${(a.hue + 150) % 360}, 100%, 55%)`);
      
      ctx.shadowBlur = 20;
      ctx.fillStyle = grad2;
      ctx.beginPath();
      ctx.arc(0, 3, 10, Math.PI, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      for (let i = 0; i < 4; i++) {
        const angle = a.bubblePhase + i * 1.57;
        const dist = 12 + Math.sin(a.bubblePhase * 0.5 + i) * 3;
        const size = 2 + Math.sin(a.bubblePhase * 0.7 + i * 1.2) * 1;
        const alpha = 0.4 + Math.sin(a.bubblePhase * 0.8 + i * 1.8) * 0.3;
        ctx.fillStyle = `hsla(${(a.hue + i * 90) % 360}, 100%, 90%, ${alpha})`;
        ctx.beginPath();
        const cx = Math.cos(angle) * dist;
        const cy = Math.sin(angle) * dist * 0.7 + 5;
        for (let j = 0; j < 5; j++) {
          const starAngle = (j / 5) * Math.PI * 2 - Math.PI / 2 + a.bubblePhase * 0.3;
          const r = j % 2 === 0 ? size * 1.5 : size * 0.6;
          if (j === 0) ctx.moveTo(cx + Math.cos(starAngle) * r, cy + Math.sin(starAngle) * r);
          else ctx.lineTo(cx + Math.cos(starAngle) * r, cy + Math.sin(starAngle) * r);
        }
        ctx.closePath();
        ctx.fill();
      }
      
      ctx.restore();
      return;
    }

    if (style.glow) {
      ctx.shadowColor = style.glow;
      ctx.shadowBlur = 20;
    }

    ctx.fillStyle = style.nut;
    ctx.beginPath();
    ctx.ellipse(0, 10, 9, 11, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = style.cap;
    ctx.beginPath();
    ctx.arc(0, 3, 10, Math.PI, Math.PI * 2);
    ctx.fill();

    if (a.skin === 'bubble' || a.skin === 'green') {
      a.bubblePhase += 0.05;
      for(let i=0; i<3; i++) {
        const angle = a.bubblePhase + i * 2.1;
        const radius = 14 + Math.sin(a.bubblePhase + i) * 4;
        ctx.fillStyle = `rgba(100,255,180,${0.15 + Math.sin(a.bubblePhase + i*1.5)*0.05})`;
        ctx.beginPath();
        ctx.arc(Math.cos(angle) * radius * 0.7, Math.sin(angle) * radius * 0.5 + 5, 3 + Math.sin(a.bubblePhase + i*2) * 1, 0, Math.PI*2);
        ctx.fill();
      }
    }

    if (a.skin === 'flame') {
      for(let i=0; i<3; i++) {
        const angle = a.bubblePhase + i * 2.1;
        const radius = 12 + Math.sin(a.bubblePhase * 0.7 + i) * 3;
        ctx.fillStyle = `rgba(255,200,50,${0.1 + Math.sin(a.bubblePhase + i*1.5)*0.05})`;
        ctx.beginPath();
        ctx.arc(Math.cos(angle) * radius * 0.5, -5 + Math.sin(angle) * radius * 0.3, 4 + Math.sin(a.bubblePhase + i*2) * 1.5, 0, Math.PI*2);
        ctx.fill();
      }
    }

    if (a.skin === 'cosmic') {
      a.bubblePhase += 0.03;
      for (let i = 0; i < 8; i++) {
        const angle = a.bubblePhase + i * 0.8;
        const dist = 6 + Math.sin(a.bubblePhase * 0.3 + i * 1.1) * 5;
        const size = 1.5 + Math.sin(a.bubblePhase * 0.5 + i * 0.7) * 1;
        const hue = (a.hue + i * 45) % 360;
        ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${0.15 + Math.sin(a.bubblePhase * 0.4 + i * 1.3) * 0.1})`;
        ctx.beginPath();
        ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist * 0.6 + 5, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 野獣先輩どんぐり（帽子紺色、下茶色、白い粒子）
    if (a.skin === 'beast') {
      a.bubblePhase += 0.04;
      ctx.shadowColor = 'rgba(255,255,255,0.3)';
      ctx.shadowBlur = 15;
      for (let i = 0; i < 4; i++) {
        const angle = a.bubblePhase + i * 1.57;
        const dist = 7 + Math.sin(a.bubblePhase * 0.5 + i) * 3;
        const size = 1.5 + Math.sin(a.bubblePhase * 0.7 + i * 0.9) * 1;
        const alpha = 0.2 + Math.sin(a.bubblePhase * 0.6 + i * 1.1) * 0.2;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        const cx = Math.cos(angle) * dist;
        const cy = Math.sin(angle) * dist * 0.6 + 5;
        ctx.arc(cx, cy, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }

  function createSpecialParticles(x, y, skin) {
    const style = getAcornStyle(skin);
    const colors = style.particleColors;
    const count = skin === 'phantom' 
      ? 3 + Math.floor(Math.random() * 3)
      : (skin === 'beast' ? 4 + Math.floor(Math.random() * 4) : 8 + Math.floor(Math.random() * 12));
    
    const particles = [];
    
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 6;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const type = skin === 'beast' ? 'white' : (Math.random() > 0.6 ? 'star' : (Math.random() > 0.5 ? 'circle' : 'sparkle'));
      
      particles.push({
        x: x + (Math.random() - 0.5) * 10,
        y: y + (Math.random() - 0.5) * 10,
        vx: Math.cos(angle) * speed * (0.5 + Math.random() * 0.5),
        vy: Math.sin(angle) * speed * (0.5 + Math.random() * 0.5) - 2,
        life: 1.0,
        decay: 0.008 + Math.random() * 0.015,
        size: 3 + Math.random() * 8,
        color: skin === 'beast' ? '#ffffff' : color,
        type: type,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.1,
        hue: Math.random() * 360,
      });
    }
    
    if (skin === 'phantom') {
      for (let i = 0; i < 3; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
          x: x + (Math.random() - 0.5) * 6,
          y: y + (Math.random() - 0.5) * 6,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          life: 1.0,
          decay: 0.005 + Math.random() * 0.01,
          size: 2 + Math.random() * 4,
          color: skin === 'phantom' ? `hsl(280, 100%, 70%)` : `hsl(${Math.random() * 360}, 100%, 70%)`,
          type: 'glow',
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.05,
          hue: Math.random() * 360,
        });
      }
    } else if (skin === 'beast') {
      for (let i = 0; i < 6; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.5 + Math.random() * 2;
        particles.push({
          x: x + (Math.random() - 0.5) * 8,
          y: y + (Math.random() - 0.5) * 8,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          life: 1.0,
          decay: 0.01 + Math.random() * 0.02,
          size: 1 + Math.random() * 3,
          color: `rgba(255,255,255,${0.5 + Math.random() * 0.5})`,
          type: 'glow',
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.05,
          hue: 0,
        });
      }
      playBeastSound();
    } else if (skin === 'gold' || skin === 'cosmic') {
      for (let i = 0; i < 5; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
          x: x + (Math.random() - 0.5) * 6,
          y: y + (Math.random() - 0.5) * 6,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          life: 1.0,
          decay: 0.005 + Math.random() * 0.01,
          size: 2 + Math.random() * 4,
          color: skin === 'phantom' ? `hsl(280, 100%, 70%)` : `hsl(${Math.random() * 360}, 100%, 70%)`,
          type: 'glow',
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.05,
          hue: Math.random() * 360,
        });
      }
    }
    
    return particles;
  }

  function burstAcorn() {
    if(acorns.length > 0) {
      const index = Math.floor(Math.random() * acorns.length);
      const a = acorns.splice(index, 1)[0];
      const currentX = a.x + Math.sin(a.wobble) * 3;
      const currentY = a.y + 15;
      const skin = a.skin;

      const style = getAcornStyle(skin);
      const colors = style.particleColors;
      
      // 野獣先輩: 帽子は紺色(#1a2a4a)
      const capColor = skin === 'beast' ? '#8B6B3D' : (colors[0] || '#654321');
      
      fragments.push({
        x: currentX, y: currentY,
        vx: (Math.random() - 0.5) * 6,
        vy: -4 - Math.random() * 3,
        rot: Math.random() * Math.PI,
        vrot: (Math.random() - 0.5) * 0.2,
        type: 'cap',
        alpha: 1,
        color: capColor
      });

      for(let i=0; i<3; i++) {
        fragments.push({
          x: currentX + (Math.random()-0.5)*8,
          y: currentY + 8,
          vx: (Math.random()-0.5)*8,
          vy: -2 - Math.random()*5,
          rot: Math.random() * Math.PI,
          vrot: (Math.random()-0.5)*0.3,
          type: 'nut',
          alpha: 1,
          color: skin === 'beast' ? '#1a2a4a' : (colors[i % colors.length] || colors[0])
        });
      }

      const specials = createSpecialParticles(currentX, currentY, skin);
      specialParticles.push(...specials);

      if(acorns.length < MIN_ACORN_COUNT) spawnAcornTop();
    } else {
      spawnAcornTop();
    }
  }

  function updateAndDrawEffects() {
    ctx.clearRect(0, 0, acornCanvas.width, acornCanvas.height);

    if(state === 'waiting' || state === 'playing') {
      acorns.forEach(a => drawAcorn(ctx, a));
    }

    for(let i=fragments.length-1; i>=0; i--) {
      const f = fragments[i];
      f.x += f.vx;
      f.y += f.vy;
      f.vy += 0.4;
      f.rot += f.vrot;
      f.alpha -= 0.015;

      if(f.alpha <= 0 || f.y > acornCanvas.height + 50) {
        fragments.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.globalAlpha = Math.max(0, f.alpha);
      ctx.fillStyle = f.color || '#654321';
      if(f.type === 'cap') {
        ctx.beginPath();
        ctx.arc(0, 0, 9, Math.PI, Math.PI*2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.ellipse(0, 0, 7, 9, 0, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }

    for(let i=specialParticles.length-1; i>=0; i--) {
      const p = specialParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.life -= p.decay;
      p.rot += p.rotSpeed;

      if(p.life <= 0 || p.y > acornCanvas.height + 50) {
        specialParticles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, p.life);
      
      if (p.type === 'star') {
        ctx.fillStyle = p.color;
        const s = p.size * 0.5;
        ctx.beginPath();
        for (let j = 0; j < 5; j++) {
          const angle = (j / 5) * Math.PI * 2 - Math.PI / 2;
          const r = j % 2 === 0 ? s : s * 0.4;
          if (j === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
          else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
        }
        ctx.closePath();
        ctx.fill();
      } else if (p.type === 'glow') {
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size * 0.8);
        grad.addColorStop(0, p.color);
        grad.addColorStop(0.5, p.color);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 20;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      } else if (p.type === 'sparkle') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1.5;
        const s = p.size * 0.6;
        ctx.beginPath();
        ctx.moveTo(-s, 0);
        ctx.lineTo(s, 0);
        ctx.moveTo(0, -s);
        ctx.lineTo(0, s);
        ctx.stroke();
        ctx.beginPath();
        const d = s * 0.5;
        ctx.moveTo(-d, -d);
        ctx.lineTo(d, d);
        ctx.moveTo(d, -d);
        ctx.lineTo(-d, d);
        ctx.stroke();
      } else if (p.type === 'white') {
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(255,255,255,0.5)';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      
      ctx.restore();
    }

    requestAnimationFrame(updateAndDrawEffects);
  }
  requestAnimationFrame(updateAndDrawEffects);

  function startAcornAutoSpawn() {
    stopAcornAutoSpawn();
    acornSpawnTimer = setInterval(() => {
      if(state === 'waiting' || state === 'playing') spawnAcornTop();
    }, 3000);
  }
  function stopAcornAutoSpawn() {
    if(acornSpawnTimer) { clearInterval(acornSpawnTimer); acornSpawnTimer = null; }
  }

  // ============ タイピングシステム（重複防止付き） ============
  function getRomajiChoices(char, isLast) {
    const map = {
      "あ":["a"],"い":["i"],"う":["u","wu"],"え":["e"],"お":["o"],
      "か":["ka","ca"],"き":["ki"],"く":["ku","cu","qu"],"け":["ke"],"こ":["ko","co"],
      "さ":["sa"],"し":["shi","si","ci"],"す":["su"],"せ":["se","ce"],"そ":["so"],
      "た":["ta"],"ち":["chi","ti"],"つ":["tsu","tu"],"て":["te"],"と":["to"],
      "な":["na"],"に":["ni"],"ぬ":["nu"],"ね":["ne"],"の":["no"],
      "は":["ha"],"ひ":["hi"],"ふ":["hu","fu"],"へ":["he"],"ほ":["ho"],
      "ま":["ma"],"み":["mi"],"む":["mu"],"め":["me"],"も":["mo"],
      "や":["ya"],"ゆ":["yu"],"よ":["yo"],
      "ら":["ra"],"り":["ri"],"る":["ru"],"れ":["re"],"ろ":["ro"],
      "わ":["wa"],"を":["wo"],
      "ん": isLast ? ["nn"] : ["nn","xn","n'","n"],
      "ー":["-","h","^"],
      "が":["ga"],"ぎ":["gi"],"ぐ":["gu"],"げ":["ge"],"ご":["go"],
      "ざ":["za"],"じ":["ji","zi"],"ず":["zu"],"ぜ":["ze"],"ぞ":["zo"],
      "だ":["da"],"ぢ":["di"],"づ":["du"],"で":["de"],"ど":["do"],
      "ば":["ba"],"び":["bi"],"ぶ":["bu"],"べ":["be"],"ぼ":["bo"],
      "ぱ":["pa"],"ぴ":["pi"],"ぷ":["pu"],"ぺ":["pe"],"ぽ":["po"],
      "きゃ":["kya"],"きゅ":["kyu"],"きょ":["kyo"],
      "しゃ":["sha","sya","silya"],"しゅ":["shu","syu"],"しょ":["sho","syo"],
      "ちゃ":["cha","cya","tya"],"ちゅ":["chu","cyu","tyu"],"ちょ":["cho","cyo","tyo"],
      "にゃ":["nya"],"にゅ":["nyu"],"にょ":["nyo"],
      "ひゃ":["hya"],"ひゅ":["hyu"],"ひょ":["hyo"],
      "みゃ":["mya"],"みゅ":["myu"],"みょ":["myo"],
      "りゃ":["rya"],"りゅ":["ryu"],"りょ":["ryo"],
      "ぎゃ":["gya"],"ぎゅ":["gyu"],"ぎょ":["gyo"],
      "じゃ":["ja","zya","jya","zilya"],"じゅ":["ju","zyu","jyu"],"じょ":["jo","zyo","jyo"],
      "びゃ":["bya"],"びゅ":["byu"],"びょ":["byo"],
      "ぴゃ":["pya"],"ぴゅ":["pyu"],"ぴょ":["pyo"],
      "ふぁ":["fa"],"ふぃ":["fi"],"ふぇ":["fe"],"ふぉ":["fo"],
      "うぃ":["wi"],"うぇ":["we"],"うぉ":["wo"],
      "てぃ":["ti","thi"],"でぃ":["di"],
      "とぅ":["twu"],"どぅ":["dwu"],
      "くぁ":["qa","kwa"],"くぃ":["qi"],"くぇ":["qe"],"くぉ":["qo"],
      "ぐぁ":["gwa"],
      // 追加: 促音・拗音対応
      "っ": ["xtu","ltu","tsu"],
      "ゃ": ["lya","xya","ya"],
      "ゅ": ["lyu","xyu","yu"],
      "ょ": ["lyo","xyo","yo"],
      // 「けん玉」用: ん + だ → nda 対応
      "んだ": ["nda","n da"],
      // 「意外と」用: が → ga, い → i が正しく認識されるように
      "がい": ["gai"],
      // 「死に方より生き方」用: しに → shini
      "しに": ["shini"],
    };
    // 2文字の組み合わせに対応
    const comboMap = {
      "んだ": ["nda"],
      "がい": ["gai"],
      "しに": ["shini"],
    };
    for (const [key, val] of Object.entries(comboMap)) {
      if (char === key) return val;
    }
    return map[char] || [char];
  }

  function parseKanaToUnits(str) {
    const units = [];
    let i = 0;
    while(i < str.length) {
      // 4文字の特殊組み合わせ
      if (i + 3 < str.length) {
        const s = str.substr(i, 4);
        const choices = getRomajiChoices(s, false);
        if (choices.length > 0 && !(choices.length === 1 && choices[0] === s)) {
          units.push({ chars: s, isLast: false, custom: choices });
          i += 4;
          continue;
        }
      }
      // 3文字（拗音など）
      if (i + 2 < str.length) {
        const s = str.substr(i, 3);
        const choices = getRomajiChoices(s, false);
        if (choices.length > 0 && !(choices.length === 1 && choices[0] === s)) {
          units.push({ chars: s, isLast: false, custom: choices });
          i += 3;
          continue;
        }
      }
      // 2文字（拗音など）
      if (i + 1 < str.length) {
        const s = str.substr(i, 2);
        const choices = getRomajiChoices(s, false);
        if (choices.length > 0 && !(choices.length === 1 && choices[0] === s)) {
          units.push({ chars: s, isLast: false, custom: choices });
          i += 2;
          continue;
        }
      }
      const s = str.substr(i, 1);
      // 促音処理
      if (s === "っ" && i + 1 < str.length) {
        const next = str.substr(i + 1, 1);
        const r = getRomajiChoices(next, false);
        units.push({ chars: "っ" + next, custom: r.map(x => x[0] + x), isLast: false });
        i += 2;
        continue;
      }
      const isLast = (i === str.length - 1);
      const choices = getRomajiChoices(s, isLast);
      units.push({ chars: s, isLast: isLast, custom: choices });
      i++;
    }
    return units;
  }

  const TARGET_LEN = 1000;
  const GAME_SECONDS = 60;
  const SENTENCE_THRESHOLD = 300;

  function createWordItem(wordObj) {
    const units = parseKanaToUnits(wordObj.kana);
    const unitChoices = units.map((u) => {
      if (u.custom) return u.custom;
      return getRomajiChoices(u.chars, u.isLast || false);
    });
    return {
      kana: wordObj.kana,
      display: useKanji ? wordObj.kanji : wordObj.kana,
      unitChoices,
      typedLength: 0,
      activePaths: null,
      currentIndex: 0,
      typedKeys: "",
      forcedRomaji: null,
      isSentence: wordObj.isSentence || false,
      id: wordObj.kana + (wordObj.isSentence ? '_s' : '')
    };
  }

  function resetUsedWords() {
    usedWords = [];
  }

  function buildQueue(minLen, useSentence = false) {
    const q=[]; let total=0;
    let attempts = 0;
    const pool = useSentence ? SENTENCE_POOL : WORD_POOL;
    let available = pool.filter(w => !usedWords.includes(w.kana + (useSentence ? '_s' : '')));
    if (available.length === 0) {
      usedWords = [];
      available = pool;
    }
    
    while(total<minLen && attempts < 10000 && available.length > 0) {
      attempts++;
      const idx = Math.floor(Math.random() * available.length);
      const w = available[idx];
      if (!w) continue;
      const item = createWordItem(w);
      if (useSentence) item.isSentence = true;
      const sample = generateAllCombinations(item.unitChoices)[0];
      if (sample) {
        q.push(item);
        total += sample.length;
        usedWords.push(w.kana + (useSentence ? '_s' : ''));
        available = available.filter((_, i) => i !== idx);
      }
      if (available.length === 0) {
        usedWords = [];
        available = pool;
      }
    }
    return q;
  }

  function generateAllCombinations(unitChoices, idx=0, current="") {
    if(idx===unitChoices.length) return [current];
    const results=[];
    for(const choice of unitChoices[idx]) {
      results.push(...generateAllCombinations(unitChoices, idx+1, current+choice));
    }
    return results;
  }

  function renderWord() {
    const w=queue[qIndex];
    if (!w) { 
      queue = buildQueue(TARGET_LEN, isSentenceMode);
      qIndex = 0;
      renderWord();
      return;
    }
    kanaDisplayEl.textContent = w.display;
    if(!w.activePaths) { w.activePaths=generateAllCombinations(w.unitChoices); w.currentIndex=0; w.typedKeys=""; }
    let displayStr = w.forcedRomaji;
    if(!displayStr) {
      const matching = w.activePaths.filter(p=>p.startsWith(w.typedKeys));
      displayStr = matching.length>0 ? matching[0] : w.activePaths[0];
    }
    if (!displayStr) {
      displayStr = w.unitChoices.map(c => c[0] || '').join('');
    }
    romajiDisplayEl.innerHTML = displayStr.split('').map((ch,i)=>{
      let cls='ch-pending';
      if(i<w.typedLength) cls='ch-done';
      else if(i===w.typedLength) cls='ch-next';
      return '<span class="'+cls+'">'+ch+'</span>';
    }).join('');
  }

  function renderHud() {
    scoreValueEl.textContent = Math.floor(score);
    multiplierValueEl.textContent = '×' + (Number.isInteger(multiplier)?multiplier:multiplier.toFixed(1));
    timerEl.textContent = timeLeft;
    hudTimerEl.classList.toggle('low', timeLeft<=10);
  }

  function showPopup(text) {
    popupEl.textContent=text;
    popupEl.classList.remove('show');
    void popupEl.offsetWidth;
    popupEl.classList.add('show');
    clearTimeout(popupTimeout);
    popupTimeout=setTimeout(()=>popupEl.classList.remove('show'),900);
  }

  function updateUIVisibility() {
    const isMenu = (state === 'menu');
    const isGame = (state === 'waiting' || state === 'playing' || state === 'result');
    
    hankoBadge.classList.toggle('hidden-ui', isGame);
    topNav.classList.toggle('hidden-ui', isGame);
  }

  function checkSentenceMode() {
    if (!isSentenceMode && score >= SENTENCE_THRESHOLD) {
      pendingSentenceMode = true;
      showPopup('📖 文章モード準備中...（現在の単語を終わらせてから移行）');
    }
  }

  function tryActivateSentenceMode() {
    if (pendingSentenceMode && !isSentenceMode) {
      isSentenceMode = true;
      pendingSentenceMode = false;
      showPopup('📖 文章モード突入！');
      usedWords = [];
      queue = buildQueue(TARGET_LEN, true);
      qIndex = 0;
      renderWord();
    }
  }

  function initGame() {
    state='waiting';
    isSentenceMode = false;
    pendingSentenceMode = false;
    resetUsedWords();
    if (soundBuffers.bgm) {
      playBgmLoop();
    }
    acorns=[];
    specialParticles = [];
    fragments = [];
    for(let i=0;i<MIN_ACORN_COUNT+5;i++) spawnAcornTop();
    startAcornAutoSpawn();
    queue = buildQueue(TARGET_LEN, false);
    qIndex=0; score=0; multiplier=1; correctTotal=0; lastMilestoneCount=0; timeLeft=GAME_SECONDS; gameTotalTyped=0;
    lastGameTyped = 0;
    lastGameDuration = 0;
    menuScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    resultOverlay.classList.remove('active');
    updateUIVisibility();
    renderWord(); renderHud();
  }

  function startTimer() {
    state='playing';
    milestoneStartTime=performance.now();
    let last10sCount = 0;
    let last10sStart = performance.now();
    
    timerInterval = setInterval(()=>{
      timeLeft--;
      renderHud();
      
      const now = performance.now();
      if (now - last10sStart >= 10000) {
        const typedIn10s = correctTotal - last10sCount;
        if (typedIn10s > max10sTyped) {
          max10sTyped = typedIn10s;
          saveData();
        }
        last10sCount = correctTotal;
        last10sStart = now;
      }
      
      if(timeLeft<=0) endGame(true);
    },1000);
  }

  function checkMilestone() {
    const diffCount=correctTotal-lastMilestoneCount;
    const diffTime=(performance.now()-milestoneStartTime)/1000;
    if(diffTime<=10 && diffCount>=50) {
      multiplier*=2; lastMilestoneCount=correctTotal; milestoneStartTime=performance.now();
      showPopup('50字達成！さらに2倍 (×'+multiplier+')');
    } else if(diffTime<=10 && diffCount>=25) {
      multiplier*=2; lastMilestoneCount=correctTotal; milestoneStartTime=performance.now();
      showPopup('25字達成！×2倍 (×'+multiplier+')');
    } else if(diffTime>10) {
      lastMilestoneCount=correctTotal; milestoneStartTime=performance.now();
    }
  }

  // 入力処理（空白・括弧対応）
  function handleTypingKey(key) {
    if(state==='waiting') {
      playStartSound();
      startTimer();
    }

    checkSentenceMode();

    const word=queue[qIndex];
    if(!word) return;
    if(!word.activePaths) { word.activePaths=generateAllCombinations(word.unitChoices); word.currentIndex=0; word.typedKeys=""; }

    // スペースは完全に無視（何も打たなくてOK）
    if (key === ' ' || key === 'Space') {
      return;
    }

    // 括弧の処理: Shift+8 -> '(' , Shift+9 -> ')'
    let processedKey = key;
    if (key === '(') processedKey = '(';
    if (key === ')') processedKey = ')';

    const possibleNext=new Set();
    word.activePaths.forEach(p=>{ 
      if(p && p.length>word.currentIndex) {
        const nextChar = p[word.currentIndex];
        // 括弧の一致をチェック（括弧はそのまま）
        if (nextChar === '(' || nextChar === ')') {
          if (processedKey === nextChar) possibleNext.add(nextChar);
        } else {
          possibleNext.add(nextChar.toLowerCase());
        }
      }
    });

    // 現在の位置の文字をチェック
    const currentTarget = word.activePaths.length > 0 && word.activePaths[0].length > word.currentIndex 
      ? word.activePaths[0][word.currentIndex] : null;
    
    let isMatch = false;
    if (currentTarget && (currentTarget === '(' || currentTarget === ')')) {
      if (processedKey === currentTarget) isMatch = true;
    } else {
      isMatch = possibleNext.has(processedKey.toLowerCase());
    }

    if (isMatch) {
      playTypedSound();
      
      burstAcorn();
      word.currentIndex++;
      word.typedLength=Math.min(word.currentIndex, word.activePaths[0] ? word.activePaths[0].length : 0);
      word.typedKeys += processedKey.toLowerCase();
      word.activePaths=word.activePaths.filter(p=>p && p.startsWith(word.typedKeys));
      if(word.activePaths.length>0) word.forcedRomaji=word.activePaths[0];

      const isCompleted = word.activePaths.some(p=>p===word.typedKeys) || word.currentIndex>= (word.forcedRomaji ? word.forcedRomaji.length : 0);
      correctTotal++;
      
      let addScore = multiplier;
      if (equippedAcorn === 'double') {
        addScore = multiplier * 2;
      }
      if (superMode) {
        addScore = 500;
      }
      score += addScore;
      
      gameTotalTyped++;
      checkMilestone();

      if(isCompleted || word.activePaths.length===0) {
        qIndex++;
        tryActivateSentenceMode();
        if(queue.length-qIndex<6) {
          const extra = buildQueue(200, isSentenceMode);
          queue = queue.concat(extra);
        }
      }
      renderWord(); renderHud();
    } else {
      wordStageEl.classList.remove('shake');
      void wordStageEl.offsetWidth;
      wordStageEl.classList.add('shake');
    }
  }

  function endGame(save) {
    if(timerInterval) { clearInterval(timerInterval); timerInterval=null; }
    stopAcornAutoSpawn();
    stopBgm();
    
    if (save) {
      lastGameTyped = gameTotalTyped;
      lastGameDuration = 60 - timeLeft;
    }
    
    state='result';
    gameScreen.classList.add('hidden');

    if(save) {
      const finalScore=Math.floor(score);
      modalScoreEl.textContent=finalScore;
      modalBadgeContainer.innerHTML='';

      totalTyped += gameTotalTyped;
      updateTotalTypedDisplay();

      addCoinsFromScore(finalScore);

      if(finalScore>highscore) {
        highscore=finalScore;
        highscoreValueEl.textContent=highscore;
        const badge=document.createElement('div');
        badge.className='result-badge-record';
        badge.textContent='🏆 最新記録！';
        modalBadgeContainer.appendChild(badge);
      }
      
      playResultSound();
      
      checkAchievements();
      
      saveData();
      resultOverlay.classList.add('active');
      updateUIVisibility();
    } else {
      state='menu';
      menuScreen.classList.remove('hidden');
      startAcornAutoSpawn();
      updateUIVisibility();
    }
  }

  // ============ UI更新 ============
  function updateTotalTypedDisplay() {
    totalTypedDisplayEl.textContent = '入力:' + totalTyped + '字';
  }

  function updateShopUI() {
    shopHighscoreEl.textContent = highscore;
    shopTotalTypedEl.textContent = totalTyped;
    renderShopItems();
  }

  function renderShopItems() {
    let html = '';

    html += '<div class="shop-section-title">🌄 背景スキン</div>';
    html += '<div class="shop-items">';
    for(const [id, skin] of Object.entries(BG_SKINS)) {
      if (id === 'beast_room' && !beastBgUnlocked) continue;
      
      const owned = ownedBg.includes(id);
      const equipped = equippedBg === id;
      const canBuy = (skin.priceType === 'coin' && coins >= skin.price) ||
                     skin.priceType === 'none';
      const priceLabel = skin.priceType === 'none' ? '初期' :
                         skin.priceType === 'coin' ? '📝'+skin.price+'字' : '🏆'+skin.price;

      html += `<div class="shop-item ${owned?'owned':''} ${equipped?'equipped':''}">
        <div class="shop-item-info">
          <div class="shop-item-name">${skin.name} ${equipped?' ✅':''}</div>
          <div class="shop-item-desc">${skin.desc}</div>
        </div>
        <div class="shop-item-price">${priceLabel}</div>
        <button class="shop-item-btn ${equipped?'equip-btn':owned?'owned-btn':''}" 
                data-type="bg" data-id="${id}" ${(!owned && !canBuy) ? 'disabled':''}>
          ${equipped ? '装備中' : owned ? '装備' : '購入'}
        </button>
      </div>`;
    }
    html += '</div>';

    html += '<div class="shop-section-title">🌰 どんぐりスキン</div>';
    html += '<div class="shop-items">';
    for(const [id, skin] of Object.entries(ACORN_SKINS)) {
      if (id === 'double' && !doubleAcornUnlocked) continue;
      if (id === 'beast' && !beastAcornUnlocked) continue;
      
      const owned = ownedAcorn.includes(id);
      const equipped = equippedAcorn === id;
      const canBuy = (skin.priceType === 'coin' && coins >= skin.price) ||
                     skin.priceType === 'none';
      const priceLabel = skin.priceType === 'none' ? '初期' :
                         skin.priceType === 'coin' ? '📝'+skin.price+'字' : '🏆'+skin.price;

      const isPhantom = id === 'phantom';
      const displayName = isPhantom ? '🌀 ' + skin.name : skin.name;

      html += `<div class="shop-item ${owned?'owned':''} ${equipped?'equipped':''}" style="${(isPhantom && owned) ? 'border-color: var(--phantom); background: rgba(155,89,182,0.15);' : ''}">
        <div class="shop-item-info">
          <div class="shop-item-name">${displayName} ${equipped?' ✅':''}</div>
          <div class="shop-item-desc">${skin.desc}</div>
        </div>
        <div class="shop-item-price">${priceLabel}</div>
        <button class="shop-item-btn ${equipped?'equip-btn':owned?'owned-btn':''}" 
                data-type="acorn" data-id="${id}" ${(!owned && !canBuy) ? 'disabled':''}>
          ${equipped ? '装備中' : owned ? '装備' : '購入'}
        </button>
      </div>`;
    }
    html += '</div>';

    shopItemsContainer.innerHTML = html;

    shopItemsContainer.querySelectorAll('.shop-item-btn').forEach(btn => {
      btn.addEventListener('click', handleShopAction);
    });
  }

  function handleShopAction(e) {
    const btn = e.currentTarget;
    const type = btn.dataset.type;
    const id = btn.dataset.id;

    if(type === 'bg') {
      if(ownedBg.includes(id)) {
        equippedBg = id;
        saveData();
        updateShopUI();
        return;
      }
      const skin = BG_SKINS[id];
      if(skin.priceType === 'coin' && totalTyped >= skin.price) {
        ownedBg.push(id);
        equippedBg = id;
        saveData();
        updateShopUI();
        highscoreValueEl.textContent = highscore;
      }
    } else if(type === 'acorn') {
      if(ownedAcorn.includes(id)) {
        equippedAcorn = id;
        saveData();
        updateShopUI();
        updatePhantomFont();
        return;
      }
      const skin = ACORN_SKINS[id];
      if(skin.priceType === 'coin' && totalTyped >= skin.price) {
        ownedAcorn.push(id);
        equippedAcorn = id;
        saveData();
        updateShopUI();
        updatePhantomFont();
      }
    }
  }

  // ============ 設定関連 ============
  function updateSettingsUI() {
    soundTypedInput.value = soundTyped;
    soundStartInput.value = soundStart;
    soundResultInput.value = soundResult;
    soundBgmInput.value = soundBgm;
    ['typed', 'start', 'result', 'bgm'].forEach(type => {
      const fileNameEl = document.getElementById('file-name-' + type);
      if (fileNameEl) fileNameEl.textContent = '';
    });
    if (codeVerified) {
      codeStatus.textContent = '✅ 認証済み (超厳重)';
      codeStatus.className = 'code-status success';
    } else {
      codeStatus.textContent = '🔒 未認証';
      codeStatus.className = 'code-status';
    }
    
    const statuses = ['typed', 'start', 'result', 'bgm'];
    for (const type of statuses) {
      const statusEl = document.getElementById('status-' + type);
      const url = document.getElementById('sound-' + type).value.trim();
      if (url) {
        statusEl.textContent = '📁 外部ファイル設定済み';
        statusEl.className = 'sound-status success';
      } else {
        statusEl.textContent = '🎵 デフォルト音声を使用中';
        statusEl.className = 'sound-status';
      }
    }
  }

  // ============ コード認証システム ============
  function hashPassword(pwd) {
    let hash = 0;
    for (let i = 0; i < pwd.length; i++) {
      const char = pwd.charCodeAt(i);
      hash = ((hash << 5) - hash) + char;
      hash = hash & hash;
    }
    const salt = "D0ngur1Typ1ngS3cur3";
    let combined = pwd + salt;
    let h = 0;
    for (let i = 0; i < combined.length; i++) {
      h = ((h << 7) - h) + combined.charCodeAt(i);
      h = h & h;
    }
    return (h >>> 0).toString(16).padStart(8, '0');
  }

  const CORRECT_HASH_SUPER = hashPassword("74965832");
  const CORRECT_HASH_NORMAL = hashPassword("74153695");
  const CORRECT_HASH_PHANTOM = hashPassword("5724");
  const CORRECT_HASH_DOUBLE = hashPassword("6769");
  const CORRECT_HASH_BEAST = hashPassword("810");

  function verifyCode(input) {
    const inputHash = hashPassword(input);
    if (inputHash === CORRECT_HASH_SUPER) return 'super';
    if (inputHash === CORRECT_HASH_NORMAL) return 'normal';
    if (inputHash === CORRECT_HASH_PHANTOM) return 'phantom';
    if (inputHash === CORRECT_HASH_DOUBLE) return 'double';
    if (inputHash === CORRECT_HASH_BEAST) return 'beast';
    return false;
  }

  function executeCodeAuth() {
    const input = codeInput.value.trim();
    if (!input) {
      codeStatus.textContent = '❌ パスワードを入力してください';
      codeStatus.className = 'code-status error';
      return;
    }
    const result = verifyCode(input);
    if (result === 'super') {
      codeVerified = true;
      codeStatus.textContent = '✅ スーパーモード発動！ 全解除 + 1文字500スコア';
      codeStatus.className = 'code-status success';
      unlockAllAchievementsAndShop();
      saveData();
    } else if (result === 'normal') {
      codeVerified = true;
      codeStatus.textContent = '✅ 通常モードに戻りました';
      codeStatus.className = 'code-status success';
      resetToNormalMode();
      saveData();
    } else if (result === 'phantom') {
      codeVerified = true;
      codeStatus.textContent = '🌀 幻のどんぐりを解き放ちました！';
      codeStatus.className = 'code-status success';
      unlockPhantomAcorn();
      saveData();
    } else if (result === 'double') {
      codeVerified = true;
      codeStatus.textContent = '🔮 ダブルどんぐりを解き放ちました！（スコア2倍）';
      codeStatus.className = 'code-status success';
      unlockDoubleAcorn();
      saveData();
    } else if (result === 'beast') {
      codeVerified = true;
      codeStatus.textContent = '🐻 野獣先輩どんぐり＆部屋を解き放ちました！';
      codeStatus.className = 'code-status success';
      unlockBeastAcorn();
      unlockBeastBg();
      saveData();
    } else {
      codeStatus.textContent = '❌ 認証失敗！ アクセス拒否';
      codeStatus.className = 'code-status error';
      console.warn('コード認証失敗:', input);
    }
  }

  // ============ イベントリスナー ============
  document.getElementById('achievement-open-btn').addEventListener('click', () => {
    updateAchievementUI();
    achievementOverlay.classList.add('active');
  });
  document.getElementById('achievement-close-btn').addEventListener('click', () => {
    achievementOverlay.classList.remove('active');
  });
  achievementOverlay.addEventListener('click', (e) => {
    if(e.target === achievementOverlay) achievementOverlay.classList.remove('active');
  });

  document.getElementById('shop-open-btn').addEventListener('click', () => {
    updateShopUI();
    shopOverlay.classList.add('active');
  });
  document.getElementById('shop-close-btn').addEventListener('click', () => {
    shopOverlay.classList.remove('active');
  });
  shopOverlay.addEventListener('click', (e) => {
    if(e.target === shopOverlay) shopOverlay.classList.remove('active');
  });

  document.getElementById('settings-open-btn').addEventListener('click', () => {
    updateSettingsUI();
    settingsOverlay.classList.add('active');
  });
  document.getElementById('settings-close-btn').addEventListener('click', () => {
    settingsOverlay.classList.remove('active');
  });
  settingsOverlay.addEventListener('click', (e) => {
    if(e.target === settingsOverlay) settingsOverlay.classList.remove('active');
  });

  document.querySelectorAll('.sound-exec-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const type = btn.dataset.sound;
      const input = document.getElementById('sound-' + type);
      const url = input.value.trim();
      await applySoundSetting(type, url);
    });
  });

  // ファイル選択ボタン
  document.querySelectorAll('.sound-file-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const type = btn.dataset.sound;
      const fileInput = document.getElementById('sound-' + type + '-file');
      if (fileInput) fileInput.click();
    });
  });

  // ファイル選択時の処理
  ['typed', 'start', 'result', 'bgm'].forEach(type => {
    const fileInput = document.getElementById('sound-' + type + '-file');
    const textInput = document.getElementById('sound-' + type);
    const fileNameEl = document.getElementById('file-name-' + type);
    if (fileInput) {
      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const blobUrl = URL.createObjectURL(file);
        textInput.value = blobUrl;
        if (fileNameEl) fileNameEl.textContent = '📄 ' + file.name;
        await applySoundSetting(type, blobUrl);
        // ファイル選択をリセット（同じファイルを再選択できるように）
        fileInput.value = '';
      });
    }
  });

  [soundTypedInput, soundStartInput, soundResultInput, soundBgmInput].forEach(input => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const type = input.id.replace('sound-', '');
        const url = input.value.trim();
        applySoundSetting(type, url);
      }
    });
  });

  document.getElementById('code-exec-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    executeCodeAuth();
  });
  codeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      executeCodeAuth();
    }
  });

  settingDisplayBtn.addEventListener('click', () => {
    useKanji = !useKanji;
    settingDisplayBtn.textContent = useKanji ? "漢字" : "ひらがな";
    saveData();
  });

  resetDataBtn.addEventListener('click', () => {
    if(confirm('すべてのデータを削除しますか？')) {
      localStorage.removeItem('donguri_data');
      const d = { ...DEFAULT_DATA };
      highscore=d.highscore; totalTyped=d.totalTyped; coins=d.coins; useKanji=d.useKanji;
      equippedBg=d.equippedBg; equippedAcorn=d.equippedAcorn;
      ownedBg=d.ownedBg; ownedAcorn=d.ownedAcorn;
      unlockedAchievements=d.unlockedAchievements;
      max10sTyped=d.max10sTyped;
      soundTyped=d.soundTyped; soundStart=d.soundStart; soundResult=d.soundResult; soundBgm=d.soundBgm;
      codeVerified=d.codeVerified || false;
      superMode=d.superMode || false;
      normalMode=d.normalMode || false;
      phantomAcornUnlocked=d.phantomAcornUnlocked || false;
      doubleAcornUnlocked=d.doubleAcornUnlocked || false;
      beastAcornUnlocked=d.beastAcornUnlocked || false;
      beastBgUnlocked=d.beastBgUnlocked || false;
      highscoreValueEl.textContent='0';
      updateTotalTypedDisplay();
      settingDisplayBtn.textContent='ひらがな';
      settingsOverlay.classList.remove('active');
      updateSettingsUI();
      saveData();
      updateAchievementUI();
      soundBuffers = { typed: null, start: null, result: null, bgm: null };
      soundAudioEls = { typed: null, start: null, result: null, bgm: null };
      soundUrls = { typed: '', start: '', result: '', bgm: '' };
      for (const type of ['typed', 'start', 'result', 'bgm']) {
        const buf = generateDefaultSound(type);
        if (buf) soundBuffers[type] = buf;
      }
      stopBgm();
      updateShopUI();
    }
  });

  hankoBadge.addEventListener('click', () => {
    updateShopUI();
    shopOverlay.classList.add('active');
  });

  document.addEventListener('keydown', (e) => {
    if(shopOverlay.classList.contains('active') || 
       settingsOverlay.classList.contains('active') ||
       achievementOverlay.classList.contains('active')) {
      if(e.key === 'Escape') {
        e.preventDefault();
        shopOverlay.classList.remove('active');
        settingsOverlay.classList.remove('active');
        achievementOverlay.classList.remove('active');
      }
      return;
    }

    if(state === 'menu') {
      if(e.code === 'Space') { e.preventDefault(); initGame(); }
      return;
    }
    if(state === 'result') {
      if(e.code === 'Space') {
        e.preventDefault();
        resultOverlay.classList.remove('active');
        initGame();
      } else if(e.key === 'Escape') {
        e.preventDefault();
        resultOverlay.classList.remove('active');
        state='menu';
        menuScreen.classList.remove('hidden');
        startAcornAutoSpawn();
        updateUIVisibility();
      }
      return;
    }
    if(state === 'waiting' || state === 'playing') {
      if(e.key === 'Escape') { e.preventDefault(); endGame(false); return; }
      if(e.code === 'Space') {
        e.preventDefault();
        // スペースは完全に無視
        return;
      }
      // Shift+8, Shift+9 で括弧
      if (e.key === '(' || e.key === ')') {
        e.preventDefault();
        handleTypingKey(e.key);
        return;
      }
      if(e.key.length === 1 && /[a-zA-Z-]/.test(e.key)) {
        handleTypingKey(e.key);
      }
    }
  });

  // ============ 初期化 ============
  function init() {
    const data = loadData();
    highscore = data.highscore;
    totalTyped = data.totalTyped;
    coins = data.coins || 0;
    useKanji = data.useKanji;
    equippedBg = data.equippedBg;
    equippedAcorn = data.equippedAcorn;
    ownedBg = data.ownedBg;
    ownedAcorn = data.ownedAcorn;
    unlockedAchievements = data.unlockedAchievements || [];
    max10sTyped = data.max10sTyped || 0;
    soundTyped = data.soundTyped || '';
    soundStart = data.soundStart || '';
    soundResult = data.soundResult || '';
    soundBgm = data.soundBgm || '';
    codeVerified = data.codeVerified || false;
    superMode = data.superMode || false;
    normalMode = data.normalMode || false;
    phantomAcornUnlocked = data.phantomAcornUnlocked || false;
    doubleAcornUnlocked = data.doubleAcornUnlocked || false;
    beastAcornUnlocked = data.beastAcornUnlocked || false;
    beastBgUnlocked = data.beastBgUnlocked || false;

    highscoreValueEl.textContent = highscore;
    updateTotalTypedDisplay();
    settingDisplayBtn.textContent = useKanji ? "漢字" : "ひらがな";
    startAcornAutoSpawn();
    updateUIVisibility();
    updateAchievementUI();
    updatePhantomFont();
    updateShopUI();
    
    initAudio();
    
    // デフォルト音声を生成
    for (const type of ['typed', 'start', 'result', 'bgm']) {
      const defaultBuf = generateDefaultSound(type);
      if (defaultBuf) soundBuffers[type] = defaultBuf;
    }
    
    // 保存された音声を読み込む（ページ更新後も維持）
    setTimeout(async () => {
      if (soundTyped) {
        soundUrls.typed = soundTyped;
        const buf = await loadSound(soundTyped);
        if (buf) {
          soundBuffers.typed = buf;
          document.getElementById('status-typed').textContent = '✅ 保存済み音声を読み込みました';
          document.getElementById('status-typed').className = 'sound-status success';
        }
      }
      if (soundStart) {
        soundUrls.start = soundStart;
        const buf = await loadSound(soundStart);
        if (buf) {
          soundBuffers.start = buf;
          document.getElementById('status-start').textContent = '✅ 保存済み音声を読み込みました';
          document.getElementById('status-start').className = 'sound-status success';
        }
      }
      if (soundResult) {
        soundUrls.result = soundResult;
        const buf = await loadSound(soundResult);
        if (buf) {
          soundBuffers.result = buf;
          document.getElementById('status-result').textContent = '✅ 保存済み音声を読み込みました';
          document.getElementById('status-result').className = 'sound-status success';
        }
      }
      if (soundBgm) {
        soundUrls.bgm = soundBgm;
        const buf = await loadSound(soundBgm);
        if (buf) {
          soundBuffers.bgm = buf;
          document.getElementById('status-bgm').textContent = '✅ 保存済みBGMを読み込みました';
          document.getElementById('status-bgm').className = 'sound-status success';
        }
      }
      updateSettingsUI();
    }, 300);
    
    checkAchievements();
  }

  init();
})();
</script>
